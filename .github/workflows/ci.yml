name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # ============ 后端:编译 + 测试 + 一致性检查 ============
  rust:
    name: rust (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, user, admin, billing, worker]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.service }} -> services/${{ matrix.service }}
      - name: Check formatting
        working-directory: services/${{ matrix.service }}
        run: cargo fmt --all -- --check
      - name: Clippy
        working-directory: services/${{ matrix.service }}
        run: cargo clippy --all-targets -- -D warnings
      - name: Build
        working-directory: services/${{ matrix.service }}
        run: cargo build --release
      - name: Test
        working-directory: services/${{ matrix.service }}
        run: cargo test --release

  # ============ docs 一致性 ============
  docs-consistency:
    name: docs consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run check-api-consistency.ts
        run: |
          npm install -g tsx
          tsx tools/check-api-consistency.ts

  # ============ 部署配置检查 ============
  deploy-config:
    name: deploy config check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Caddyfile + docker-compose
        run: bash scripts/check-deploy-config.sh || true

  # ============ PC 后台构建 ============
  admin-web:
    name: admin-web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: admin-web/package-lock.json
      - run: npm ci || npm install
      - run: npm run build

  # ============ Docker 镜像构建(可选)============
  docker-build:
    name: docker build (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: rust
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, user, admin, billing, worker]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/chargepilot2026/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max