name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Backend formatting
        run: |
          make fmt
          git diff --exit-code -- '*.go'
      - name: Backend lint
        run: make lint
      - name: Check Go module graph
        run: go mod tidy -diff
      - name: Unit tests
        run: make test
      - name: Build services
        run: |
          go build -o /tmp/chargepilot-gateway ./cmd/gateway
          go build -o /tmp/chargepilot-central ./cmd/central
          go build -o /tmp/chargepilot-worker ./cmd/worker
          go build -o /tmp/chargepilot-migrate ./cmd/migrate

  admin-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: admin-web/package-lock.json
      - run: npm ci
      - run: npm run build
