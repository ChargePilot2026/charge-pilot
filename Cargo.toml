[workspace]
resolver = "2"
members = [
    "crates/common-error",
    "crates/common-config",
    "crates/common-db",
    "crates/common-redis",
    "crates/common-auth",
    "crates/common-stream",
    "crates/common-http",
    "crates/common-wechat",
    "crates/common-telemetry",
    "services/api-contracts",
    "services/gateway",
    "services/user",
    "services/admin",
    "services/billing",
    "services/worker",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "AGPL-3.0-or-later"
authors = ["ChargePilot <dev@chargepilot.example>"]
repository = "https://github.com/ChargePilot2026/charge-pilot"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.40", features = ["full"] }
tokio-util = { version = "0.7", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
async-trait = "0.1"

# Web framework
axum = { version = "0.7", features = ["macros", "ws", "tokio", "http1", "http2"] }
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.6", features = ["trace", "cors", "limit", "request-id", "util"] }
hyper = { version = "1.4", features = ["full"] }

# Database
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls",
    "mysql",
    "chrono",
    "uuid",
    "json",
    "macros",
    "migrate",
] }

# Cache & Streams
redis = { version = "0.27", features = ["tokio-rustls-comp", "streams", "connection-manager", "script"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_with = { version = "3", features = ["chrono_0_4"] }

# Time / IDs
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }

# Auth & Crypto
jsonwebtoken = "9"
argon2 = "0.5"
rand = "0.8"
hex = "0.4"
sha2 = "0.10"
hmac = "0.12"

# Tracing / Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
tracing-opentelemetry = "0.27"
opentelemetry = "0.26"
opentelemetry_sdk = { version = "0.26", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.26", features = ["tonic", "grpc-tonic"] }

# Errors / Validation
thiserror = "1"
anyhow = "1"
validator = { version = "0.18", features = ["derive"] }

# Config / Env
dotenvy = "0.15"
config = { version = "0.14", default-features = false, features = ["toml"] }

# HTTP clients
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "multipart"] }

# WebSocket / MQTT
rumqttd = "0.10"

# Logging / Misc
once_cell = "1"
bytes = "1"
url = "2"
mime = "0.3"

# utoipa OpenAPI
utoipa = { version = "5", features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "8", features = ["axum"] }

# OpenAPI / Swagger
toml = "0.8"

# Image (for icons, optional)
image = { version = "0.25", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
debug = 1