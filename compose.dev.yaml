# 用完即弃的 Go 开发栈。Rust 时代遗留的数据卷必须先删掉或重建，
# Goose 才能初始化迁移历史。
name: chargepilot-dev

x-go: &go
  image: golang:1.27
  working_dir: /workspace
  init: true
  volumes:
    - .:/workspace
    - go-modules:/go/pkg/mod
    - go-build:/root/.cache/go-build
  environment: &go-env
    TZ: Asia/Shanghai
    GOTOOLCHAIN: auto
    # 在中国大陆访问不到 proxy.golang.org，能用的是 goproxy.cn 这个镜像。
    # 等团队统一到可达的代理后删掉这段。
    GOPROXY: https://goproxy.cn,direct
    JWT_SECRET: local-dev-jwt-secret-do-not-use-in-production
    SERVICE_TOKEN: local-dev-service-token-do-not-use-in-production
    WECHAT_APPID: wx_local_dev
    WECHAT_SECRET: local-dev-placeholder
    PAYMENT_MODE: simulation
    LOGIN_MODE: development
    PHONE_ENCRYPTION_KEY: local-dev-phone-key-32-bytes-xxx
    REDIS_CACHE_URL: redis://redis-cache:6379/0
    REDIS_STREAM_URL: redis://redis-stream:6379/0
  depends_on:
    migrate: { condition: service_completed_successfully }
    redis-cache: { condition: service_healthy }
    redis-stream: { condition: service_healthy }

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: chargepilot_root_dev
      MYSQL_DATABASE: chargepilot
      MYSQL_USER: chargepilot
      MYSQL_PASSWORD: chargepilot_dev
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports: ["127.0.0.1:3306:3306"]
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/dev/init-mysql.sh:/docker-entrypoint-initdb.d/10-chargepilot.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql --protocol=TCP -h 127.0.0.1 -u chargepilot -D chargepilot -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  redis-cache:
    image: redis:8-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-stream:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    ports: ["127.0.0.1:6380:6379"]
    volumes: ["redis-stream-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: golang:1.27
    working_dir: /workspace
    command: ["go", "run", "./cmd/migrate", "--schema", "all"]
    volumes:
      - .:/workspace
      - go-modules:/go/pkg/mod
      - go-build:/root/.cache/go-build
    environment:
      GOPROXY: https://goproxy.cn,direct
      DATABASE_URL_GATEWAY: mysql://chargepilot:chargepilot_dev@mysql:3306/gateway_db
      DATABASE_URL_USER: mysql://chargepilot:chargepilot_dev@mysql:3306/user_db
      DATABASE_URL_ADMIN: mysql://chargepilot:chargepilot_dev@mysql:3306/admin_db
      DATABASE_URL_BILLING: mysql://chargepilot:chargepilot_dev@mysql:3306/billing_db
      DATABASE_URL_WORKER: mysql://chargepilot:chargepilot_dev@mysql:3306/worker_db
    depends_on:
      mysql: { condition: service_healthy }

  gateway:
    <<: *go
    command: ["go", "run", "./cmd/gateway"]
    environment:
      <<: *go-env
      DATABASE_URL: mysql://chargepilot:chargepilot_dev@mysql:3306/gateway_db
      GATEWAY_DEBUG_HEARTBEAT: true
    ports: ["127.0.0.1:8083:8083", "127.0.0.1:9100:9100"]

  central:
    <<: *go
    command: ["go", "run", "./cmd/central"]
    volumes:
      - .:/workspace
      - go-modules:/go/pkg/mod
      - go-build:/root/.cache/go-build
      - export-files:/var/lib/chargepilot/exports
    environment:
      <<: *go-env
      DATABASE_URL_USER: mysql://chargepilot:chargepilot_dev@mysql:3306/user_db
      DATABASE_URL_ADMIN: mysql://chargepilot:chargepilot_dev@mysql:3306/admin_db
      DATABASE_URL_BILLING: mysql://chargepilot:chargepilot_dev@mysql:3306/billing_db
      EXPORT_DIR: /var/lib/chargepilot/exports
      ADMIN_BOOTSTRAP_USER: ${ADMIN_BOOTSTRAP_USER:-admin}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-ChangeMe!Admin2026}
    ports: ["127.0.0.1:8080:8080"]

  worker:
    <<: *go
    command: ["go", "run", "./cmd/worker"]
    environment:
      <<: *go-env
      DATABASE_URL: mysql://chargepilot:chargepilot_dev@mysql:3306/worker_db
      DATABASE_URL_GATEWAY: mysql://chargepilot:chargepilot_dev@mysql:3306/gateway_db
      DATABASE_URL_USER: mysql://chargepilot:chargepilot_dev@mysql:3306/user_db
      DATABASE_URL_ADMIN: mysql://chargepilot:chargepilot_dev@mysql:3306/admin_db
      REGULATORY_MODE: simulation
    ports: ["127.0.0.1:8085:8085"]

  admin-web:
    image: node:24-bookworm-slim
    init: true
    working_dir: /workspace/admin-web
    command: ["sh", "-c", "npm ci --no-audit --no-fund && exec npm run dev -- --host 0.0.0.0"]
    environment:
      DEV_API_PROXY_TARGET: http://central:8080
      DEV_USE_POLLING: "true"
      VITE_API_BASE: ""
    ports: ["127.0.0.1:5173:5173"]
    volumes:
      - ./admin-web:/workspace/admin-web
      - node-modules:/workspace/admin-web/node_modules
      - npm-cache:/root/.npm
    depends_on:
      central: { condition: service_started }

  user-h5:
    image: node:24-bookworm-slim
    init: true
    working_dir: /workspace/miniprogram
    command: ["sh", "-c", "npm ci --legacy-peer-deps --no-audit --no-fund && exec npm run dev:h5"]
    environment:
      DEV_API_PROXY_TARGET: http://central:8080
      TARO_APP_API_BASE: /api/v1
      TARO_APP_LOGIN_MODE: development
    ports: ["127.0.0.1:5174:5174"]
    volumes:
      - ./miniprogram:/workspace/miniprogram
      - user-node-modules:/workspace/miniprogram/node_modules
      - npm-cache:/root/.npm
    depends_on:
      central: { condition: service_started }

volumes:
  mysql-data:
  redis-stream-data:
  go-modules:
  go-build:
  node-modules:
  npm-cache:
  export-files:
  user-node-modules:
