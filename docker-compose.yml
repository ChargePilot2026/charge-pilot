# Production topology. scripts/start.sh blocks rollout until the migration
# checklist is complete and external payment/device acceptance is recorded.
name: chargepilot

x-go-build: &go-build
  context: .
  dockerfile: docker/go.Dockerfile

services:
  chargepilot-mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?required}
      MYSQL_DATABASE: chargepilot
      MYSQL_USER: chargepilot
      MYSQL_PASSWORD: ${DB_PASSWORD:?required}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/dev/init-mysql.sh:/docker-entrypoint-initdb.d/10-chargepilot.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql --protocol=TCP -h 127.0.0.1 -u chargepilot -D chargepilot -e 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  chargepilot-redis-cache:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "384mb", "--maxmemory-policy", "allkeys-lru", "--requirepass", "${REDIS_PASSWORD:?required}"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '${REDIS_PASSWORD}' ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5

  chargepilot-redis-stream:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction", "--requirepass", "${REDIS_STREAM_PASSWORD:?required}"]
    volumes: ["redis-stream-data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '${REDIS_STREAM_PASSWORD}' ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5

  chargepilot-migrate:
    build:
      <<: *go-build
      args: { SERVICE: migrate }
    command: ["--schema", "all"]
    restart: "no"
    environment:
      DATABASE_URL_GATEWAY: mysql://chargepilot:${DB_PASSWORD}@chargepilot-mysql:3306/gateway_db
      DATABASE_URL_USER: mysql://chargepilot:${DB_PASSWORD}@chargepilot-mysql:3306/user_db
      DATABASE_URL_ADMIN: mysql://chargepilot:${DB_PASSWORD}@chargepilot-mysql:3306/admin_db
      DATABASE_URL_BILLING: mysql://chargepilot:${DB_PASSWORD}@chargepilot-mysql:3306/billing_db
      DATABASE_URL_WORKER: mysql://chargepilot:${DB_PASSWORD}@chargepilot-mysql:3306/worker_db
    depends_on:
      chargepilot-mysql: { condition: service_healthy }

  chargepilot-gateway:
    build:
      <<: *go-build
      args: { SERVICE: gateway }
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql://chargepilot:${DB_PASSWORD}@chargepilot-mysql:3306/gateway_db
      SERVICE_TOKEN: ${SERVICE_TOKEN:?required}
      DC589_ADDR: :9100
      CENTRAL_INTERNAL_URL: http://chargepilot-central:8080
    ports: ["9100:9100"]
    expose: ["8083"]
    depends_on:
      chargepilot-migrate: { condition: service_completed_successfully }

  chargepilot-central:
    build:
      <<: *go-build
      args: { SERVICE: central }
    restart: unless-stopped
    environment:
      DATABASE_URL_USER: mysql://chargepilot:${DB_PASSWORD}@chargepilot-mysql:3306/user_db
      DATABASE_URL_ADMIN: mysql://chargepilot:${DB_PASSWORD}@chargepilot-mysql:3306/admin_db
      DATABASE_URL_BILLING: mysql://chargepilot:${DB_PASSWORD}@chargepilot-mysql:3306/billing_db
      REDIS_CACHE_URL: redis://:${REDIS_PASSWORD}@chargepilot-redis-cache:6379/0
      REDIS_STREAM_URL: redis://:${REDIS_STREAM_PASSWORD}@chargepilot-redis-stream:6379/0
      JWT_SECRET: ${JWT_SECRET:?required}
      SERVICE_TOKEN: ${SERVICE_TOKEN:?required}
      WECHAT_APPID: ${WECHAT_APPID:?required}
      WECHAT_SECRET: ${WECHAT_SECRET:?required}
      GATEWAY_INTERNAL_URL: http://chargepilot-gateway:8083
      ADMIN_BOOTSTRAP_USER: ${ADMIN_BOOTSTRAP_USER:-}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
    expose: ["8080"]
    depends_on:
      chargepilot-migrate: { condition: service_completed_successfully }
      chargepilot-redis-cache: { condition: service_healthy }
      chargepilot-redis-stream: { condition: service_healthy }

  chargepilot-worker:
    build:
      <<: *go-build
      args: { SERVICE: worker }
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql://chargepilot:${DB_PASSWORD}@chargepilot-mysql:3306/worker_db
      DATABASE_URL_GATEWAY: mysql://chargepilot:${DB_PASSWORD}@chargepilot-mysql:3306/gateway_db
      DATABASE_URL_USER: mysql://chargepilot:${DB_PASSWORD}@chargepilot-mysql:3306/user_db
      DATABASE_URL_ADMIN: mysql://chargepilot:${DB_PASSWORD}@chargepilot-mysql:3306/admin_db
      REDIS_STREAM_URL: redis://:${REDIS_STREAM_PASSWORD}@chargepilot-redis-stream:6379/0
      SERVICE_TOKEN: ${SERVICE_TOKEN:?required}
      CENTRAL_INTERNAL_URL: http://chargepilot-central:8080
      GATEWAY_INTERNAL_URL: http://chargepilot-gateway:8083
    expose: ["8085"]
    depends_on:
      chargepilot-migrate: { condition: service_completed_successfully }
      chargepilot-redis-stream: { condition: service_healthy }

  chargepilot-caddy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?required}
    ports: ["80:80", "443:443"]
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./admin-web/dist:/srv/admin:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      chargepilot-central: { condition: service_started }

volumes:
  mysql-data:
  redis-stream-data:
  caddy-data:
  caddy-config:
