# docker-compose.yml · ChargePilot 一键启动
# 配套文档:docs/技术规格.md § 10.1(部署)
#
# 用法:
#   1. 复制 .env.example 为 .env,填充数据库密码 / JWT 密钥 / 微信支付配置
#   2. 复制 ./Caddyfile 到当前目录(参考 examples/Caddyfile)
#   3. docker compose up -d
#   4. 服务自动执行 sqlx::migrate!() 应用 schema 迁移
#
# 资源基线:11 核 CPU / 8.75 GB 内存(单客户单部署,§ 10.2)
# 客户服务器最低配置:4 核 / 8 GB / 100 GB SSD / 公网 ≥ 10 Mbps

version: '3.8'

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-mysql-env: &mysql-env
  MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD 必须设置}
  MYSQL_DATABASE: chargepilot  # 默认占位,各 schema 由迁移创建

services:
  # ============ MySQL 8.4 LTS(5 schema 共享) ============
  mysql:
    image: mysql:8.4
    container_name: chargepilot-mysql
    restart: unless-stopped
    environment:
      <<: *mysql-env
      # 推荐配置(根据内存调整)
      MYSQL_INNODB_BUFFER_POOL_SIZE: 2G
      MYSQL_MAX_CONNECTIONS: 500
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/conf.d:/etc/mysql/conf.d:ro  # 自定义配置
    command:
      - --default-authentication-plugin=caching_sha2_password
      - --innodb-buffer-pool-size=2G
      - --max-connections=500
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging: *default-logging
    # 不暴露公网(仅内部网络)
    networks:
      - internal

  # ============ Redis 8+（业务缓存 + Stream) ============
  redis:
    image: redis:8-alpine
    container_name: chargepilot-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly=yes
      - --maxmemory=512mb
      - --maxmemory-policy=allkeys-lru
      - --requirepass=${REDIS_PASSWORD:?REDIS_PASSWORD 必须设置}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *default-logging
    networks:
      - internal

  # ============ gateway 服务(设备长连接接入) ============
  gateway:
    image: chargepilot/gateway:${TAG:-latest}
    container_name: chargepilot-gateway
    restart: unless-stopped
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      DATABASE_URL: mysql://chargepilot:${DB_PASSWORD}@mysql:3306/gateway_db
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      RUST_LOG: info,sqlx=warn
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 必须设置}
      SERVICE_TOKEN: ${SERVICE_TOKEN:?SERVICE_TOKEN 必须设置(服务间共享密钥)}
      # 资源约束
      TOKIO_WORKER_THREADS: "2"
    ports:
      - "9100:9100"   # TCP 设备长连接
      - "1883:1883"   # MQTT 设备长连接
      - "8083:8083"   # 内部 HTTP(经 Caddy 反代,也可仅内网)
    volumes:
      - ./logs/gateway:/var/log/chargepilot
    logging: *default-logging
    networks:
      - internal
      - public   # 暴露 9100/1883 给公网设备

  # ============ user 服务(小程序 API) ============
  user:
    image: chargepilot/user:${TAG:-latest}
    container_name: chargepilot-user
    restart: unless-stopped
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      gateway: { condition: service_started }
    environment:
      DATABASE_URL: mysql://chargepilot:${DB_PASSWORD}@mysql:3306/user_db
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      RUST_LOG: info,sqlx=warn
      JWT_SECRET: ${JWT_SECRET}
      SERVICE_TOKEN: ${SERVICE_TOKEN}
      WECHAT_APPID: ${WECHAT_APPID}
      WECHAT_SECRET: ${WECHAT_SECRET}
      WECHAT_MCH_ID: ${WECHAT_MCH_ID}
      WECHAT_PAY_KEY: ${WECHAT_PAY_KEY:?V3 API 密钥}
      GATEWAY_INTERNAL_URL: http://gateway:8083
      BILLING_INTERNAL_URL: http://billing:8084
    ports:
      - "8081:8081"   # 内部 HTTP(经 Caddy 反代)
    volumes:
      - ./logs/user:/var/log/chargepilot
    logging: *default-logging
    networks:
      - internal

  # ============ admin 服务(PC 后台 API + 静态资源) ============
  admin:
    image: chargepilot/admin:${TAG:-latest}
    container_name: chargepilot-admin
    restart: unless-stopped
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      user: { condition: service_started }
    environment:
      DATABASE_URL: mysql://chargepilot:${DB_PASSWORD}@mysql:3306/admin_db
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      RUST_LOG: info,sqlx=warn
      JWT_SECRET: ${JWT_SECRET}
      SERVICE_TOKEN: ${SERVICE_TOKEN}
      USER_INTERNAL_URL: http://user:8081
      GATEWAY_INTERNAL_URL: http://gateway:8083
      BILLING_INTERNAL_URL: http://billing:8084
    ports:
      - "8082:8082"   # 内部 HTTP(经 Caddy 反代)
    volumes:
      - ./logs/admin:/var/log/chargepilot
      # PC 后台 React SPA 静态资源(构建产物挂载)
      - ./admin-web/dist:/app/static:ro
    logging: *default-logging
    networks:
      - internal

  # ============ billing 服务(计费 + 分账) ============
  billing:
    image: chargepilot/billing:${TAG:-latest}
    container_name: chargepilot-billing
    restart: unless-stopped
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      admin: { condition: service_started }
    environment:
      DATABASE_URL: mysql://chargepilot:${DB_PASSWORD}@mysql:3306/billing_db
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      RUST_LOG: info,sqlx=warn
      JWT_SECRET: ${JWT_SECRET}
      SERVICE_TOKEN: ${SERVICE_TOKEN}
      ADMIN_INTERNAL_URL: http://admin:8082
    ports:
      - "8084:8084"   # 内部 HTTP(不暴露公网)
    volumes:
      - ./logs/billing:/var/log/chargepilot
    logging: *default-logging
    networks:
      - internal

  # ============ worker 服务(后台任务 + Stream 消费) ============
  worker:
    image: chargepilot/worker:${TAG:-latest}
    container_name: chargepilot-worker
    restart: unless-stopped
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      user: { condition: service_started }
      admin: { condition: service_started }
      billing: { condition: service_started }
    environment:
      DATABASE_URL: mysql://chargepilot:${DB_PASSWORD}@mysql:3306/worker_db
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      RUST_LOG: info,sqlx=warn
      JWT_SECRET: ${JWT_SECRET}
      SERVICE_TOKEN: ${SERVICE_TOKEN}
      ADMIN_INTERNAL_URL: http://admin:8082
      USER_INTERNAL_URL: http://user:8081
      GATEWAY_INTERNAL_URL: http://gateway:8083
    # 无 ports(无对外 HTTP)
    volumes:
      - ./logs/worker:/var/log/chargepilot
    logging: *default-logging
    networks:
      - internal

  # ============ Caddy 2.11+(反代 + TLS 终止) ============
  caddy:
    image: caddy:2.11-alpine
    container_name: chargepilot-caddy
    restart: unless-stopped
    depends_on:
      user: { condition: service_started }
      admin: { condition: service_started }
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging: *default-logging
    networks:
      - internal
      - public

networks:
  internal:
    driver: bridge
  public:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  caddy_data:
  caddy_config: