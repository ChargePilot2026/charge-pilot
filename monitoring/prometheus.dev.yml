global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: gateway
    static_configs:
      - targets: ["gateway:8083"]
  - job_name: central
    static_configs:
      - targets: ["central:8080"]
  - job_name: worker
    static_configs:
      - targets: ["worker:8085"]
